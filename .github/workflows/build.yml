name: Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Build executable
        run: uv run pyinstaller echo-chamber.spec --clean --noconfirm

      - name: Package Linux artifact
        if: runner.os == 'Linux'
        run: tar -czf echo-chamber-linux.tar.gz -C dist EchoChamber

      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/EchoChamber.exe -DestinationPath echo-chamber-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: echo-chamber-${{ runner.os }}
          path: echo-chamber-*
          if-no-files-found: error
